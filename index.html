<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumpulan Tugas Mandiri</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background-color: #f4f6f9; color: #333; margin: 0; }
    .container { max-width: 450px; margin: 30px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
    input[type="text"], input[type="file"], select { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input[type="text"]:focus, select:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 5px rgba(26,115,232,0.2); }
    button { width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { margin-top: 20px; padding: 12px; text-align: center; font-weight: bold; display: none; border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Formulir Tugas Siswa</h2>
  <form id="myForm">
    <div class="form-group">
      <label for="namaSiswa">Nama Lengkap</label>
      <input type="text" id="namaSiswa" required placeholder="Masukkan nama lengkap Anda">
    </div>
    <div class="form-group">
      <label for="mataPelajaran">Mata Pelajaran</label>
      <select id="mataPelajaran">
        <option value="Matematika">Matematika</option>
        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
        <option value="IPA / Teknologi">IPA / Teknologi</option>
      </select>
    </div>
    <div class="form-group">
      <label for="fileTugas">Pilih File Tugas (PDF, Doc, Gambar)</label>
      <input type="file" id="fileTugas" required>
    </div>
    <button type="submit" id="btnSubmit">Kirim Tugas Sekarang</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // ⚠️ GANTI TEKS DI DALAM TANDA KUTIP DENGAN LINK WEB APP GOOGLE APPS SCRIPT (/exec) ANDA
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyymUPFn8spfn273gogd5t-9bSke5CPIDp99uuvWAnzPzbLTOLP5Zhpll6k4hQ4_iCV4Q/exec";

  document.getElementById("myForm").addEventListener("submit", function(event) {
    event.preventDefault();
    
    const btn = document.getElementById("btnSubmit");
    const statusDiv = document.getElementById("status");
    const fileInput = document.getElementById("fileTugas");
    const file = fileInput.files[0];
    
    if (!file) return;

    btn.disabled = true;
    btn.innerText = "Sedang Mengirim...";
    statusDiv.style.display = "block";
    statusDiv.style.backgroundColor = "#feeec3";
    statusDiv.style.color = "#856404";
    statusDiv.innerText = "Memproses berkas, mohon tunggu sebentar...";

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function() {
      const dataKirim = {
        namaSiswa: document.getElementById("namaSiswa").value,
        mataPelajaran: document.getElementById("mataPelajaran").value,
        fileName: file.name,
        fileType: file.type,
        fileData: reader.result
      };

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        body: JSON.stringify(dataKirim),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "sukses") {
          statusDiv.style.backgroundColor = "#d4edda";
          statusDiv.style.color = "#155724";
          statusDiv.innerText = data.pesan;
          document.getElementById("myForm").reset();
        } else {
          throw new Error(data.pesan);
        }
      })
      .catch(error => {
        statusDiv.style.backgroundColor = "#f8d7da";
        statusDiv.style.color = "#721c24";
        statusDiv.innerText = "Gagal Mengirim: " + error.message;
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "Kirim Tugas Sekarang";
      });
    };
  });
</script>
</body>
</html>
