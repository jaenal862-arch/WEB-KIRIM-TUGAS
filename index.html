<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumpulan Tugas Informatika</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a73e8; margin: 5px 0; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 10px; text-align: center; font-weight: bold; display: none; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Pengumpulan Tugas/Remedial</h2>
  <h2>Mata Pelajaran Informatika</h2>
  
  <form id="myForm">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="namaSiswa" required placeholder="Masukkan Nama Anda">
    </div>
    <div class="form-group">
      <label>NISN</label>
      <input type="text" id="NISN" required placeholder="Masukkan NISN Anda">
    </div>
    <div class="form-group">
      <label>Kelas</label>
      <select id="Kelas">
        <option value="XII.4">XII.4</option>
        <option value="XII.5">XII.5</option>
        <option value="XII.6">XII.6</option>
        <option value="XII.7">XII.7</option>
        <option value="XII.8">XII.8</option>
      </select>
    </div>
    <div class="form-group">
      <label>Materi Pelajaran / Tugas / Remedial</label>
      <select id="mataPelajaran">
        <option value="Sistem Bilangan Biner">Sistem Bilangan Biner</option>
        <option value="Ms.Excel">Ms.Excel</option>
        <option value="Pemrograman HTML/Appscript">Pemrograman HTML/Appscript</option>
      </select>
    </div>
    <div class="form-group">
      <label>Pilih File Tugas/Remedial (PDF/Gambar/Doc)</label>
      <input type="file" id="fileTugas" required>
    </div>
    <button type="submit" id="btnSubmit">Kirim</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // ⚠️ GANTI LINK DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT (/exec) ANDA
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyymUPFn8spfn273gogd5t-9bSke5CPIDp99uuvWAnzPzbLTOLP5Zhpll6k4hQ4_iCV4Q/exec";

  document.getElementById("myForm").addEventListener("submit", function(event) {
    event.preventDefault();
    
    const btn = document.getElementById("btnSubmit");
    const statusDiv = document.getElementById("status");
    const fileInput = document.getElementById("fileTugas");
    const file = fileInput.files[0]; // Mengambil objek file pertama
    
    if (!file) return;

    // Mengunci tombol agar tidak diklik dua kali
    btn.disabled = true;
    btn.innerText = "Mengirim...";
    statusDiv.style.display = "block";
    statusDiv.style.backgroundColor = "#feeec3";
    statusDiv.style.color = "#856404";
    statusDiv.innerText = "Sedang mengunggah file ke server...";

    // Proses konversi file menjadi teks Base64 untuk dikirim lintas domain
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function() {
      const dataKirim = {
        namaSiswa: document.getElementById("namaSiswa").value,
        nisn: document.getElementById("NISN").value,
        kelas: document.getElementById("Kelas").value,
        mataPelajaran: document.getElementById("mataPelajaran").value,
        fileName: file.name,
        fileType: file.type,
        fileData: reader.result
      };

      // Mengirim data ke Backend Google Apps Script menggunakan fetch
      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        body: JSON.stringify(dataKirim),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "sukses") {
          statusDiv.style.backgroundColor = "#d4edda";
          statusDiv.style.color = "#155724";
          statusDiv.innerText = data.pesan;
          document.getElementById("myForm").reset();
        } else {
          throw new Error(data.pesan);
        }
      })
      .catch(error => {
        statusDiv.style.backgroundColor = "#f8d7da";
        statusDiv.style.color = "#721c24";
        statusDiv.innerText = "Gagal mengirim: " + error.message;
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "Kirim";
      });
    };
  });
</script>
</body>
</html>
